<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Dhaka Ladies Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #b8860b;
      --gold-light: #d4a017;
      --gold-dark: #8f6908;
      --gold-pale: rgba(184, 134, 11, 0.08);
      --gold-glow: rgba(184, 134, 11, 0.25);
      --white: #ffffff;
      --gray-100: #f8f8f8;
      --gray-300: #dddddd;
      --gray-500: #888888;
      --gray-700: #444444;
      --error: #dc3545;
      --success: #198754;
      --warning: #e6a817;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.35); border-radius: 3px; }

    /* ── Background & Layout ── */
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.72) 0%, rgba(30,10,0,0.80) 100%),
        url('assets/img/BG-01.jpeg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      overflow-x: hidden;
    }

    /* Ambient orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    body::before {
      width: 560px; height: 560px;
      background: radial-gradient(circle, rgba(184,134,11,0.16) 0%, transparent 70%);
      top: -180px; left: -180px;
      animation-duration: 10s;
    }

    body::after {
      width: 440px; height: 440px;
      background: radial-gradient(circle, rgba(184,134,11,0.13) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      animation-duration: 14s;
      animation-delay: -4s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 40px) scale(1.08); }
    }

    /* ── Card ── */
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 44px 42px 38px;
      box-shadow:
        0 2px 0 rgba(184,134,11,0.35) inset,
        0 32px 80px rgba(0,0,0,0.32),
        0 4px 24px rgba(184,134,11,0.12);
      border: 1px solid rgba(184,134,11,0.18);
      animation: cardIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      overflow: hidden;
    }

    /* Top shimmer bar */
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--gold-light) 50%, var(--gold) 70%, transparent 100%);
      background-size: 200% 100%;
      border-radius: 28px 28px 0 0;
      animation: shimmerBar 3s ease-in-out infinite;
    }

    @keyframes shimmerBar {
      0%   { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(52px) scale(0.93);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Floating sparkles */
    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      pointer-events: none;
      animation: sparkleAnim 3.5s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { width: 5px; height: 5px; top: 16%; right: 8%;  animation-delay: 0s; }
    .sparkle:nth-child(2) { width: 4px; height: 4px; top: 55%; right: 5%;  animation-delay: 1.4s; }
    .sparkle:nth-child(3) { width: 3px; height: 3px; top: 35%; left: 7%;  animation-delay: 2.3s; }

    @keyframes sparkleAnim {
      0%, 100% { opacity: 0; transform: scale(0.5) translateY(0); }
      50%       { opacity: 0.5; transform: scale(1.2) translateY(-14px); }
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 26px;
      animation: fadeDown 0.6s 0.15s both;
    }

    .logo-wrapper {
      display: inline-block;
      padding: 13px 22px;
      background: linear-gradient(135deg, rgba(184,134,11,0.06), rgba(184,134,11,0.02));
      border-radius: 16px;
      border: 1px solid rgba(184,134,11,0.14);
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .logo-wrapper:hover {
      box-shadow: 0 8px 28px var(--gold-glow);
      transform: translateY(-2px);
    }

    .logo img {
      height: 44px;
      max-width: 200px;
      display: block;
    }

    /* ── Heading ── */
    .heading-block {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeDown 0.6s 0.25s both;
    }

    .heading-block h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .heading-block h1::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      margin: 8px auto 0;
      transition: width var(--transition);
    }

    .heading-block:hover h1::after { width: 80px; }

    .heading-block p {
      color: var(--gray-500);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      margin: 0;
    }

    /* ── Step progress ── */
    .step-progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 28px;
      animation: fadeDown 0.6s 0.3s both;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .step-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--gray-300);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #bbb;
      transition: all var(--transition);
      position: relative;
      z-index: 1;
    }

    .step-label {
      font-size: 10px;
      font-weight: 600;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color var(--transition);
      white-space: nowrap;
    }

    .step-line {
      width: 60px;
      height: 2px;
      background: var(--gray-300);
      margin-bottom: 22px;
      transition: background var(--transition);
      position: relative;
      overflow: hidden;
    }

    .step-line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Active / completed states */
    .step.active .step-circle {
      border-color: var(--gold);
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: white;
      box-shadow: 0 4px 14px var(--gold-glow);
    }

    .step.active .step-label { color: var(--gold); }

    .step.done .step-circle {
      border-color: var(--success);
      background: var(--success);
      color: white;
    }

    .step.done .step-label { color: var(--success); }
    .step-line.done::after { transform: scaleX(1); }

    /* ── Form ── */
    form {
      display: grid;
      gap: 16px;
    }

    /* Step panels */
    .step-panel {
      display: none;
      gap: 16px;
      animation: panelIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .step-panel.active {
      display: grid;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes panelBack {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .step-panel.back-anim { animation: panelBack 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Input groups */
    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gold-dark);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 7px;
      transition: color var(--transition);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--gray-500);
      transition: color var(--transition);
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 15px 16px 15px 48px;
      border: 1.5px solid var(--gray-300);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--gray-700);
      background: var(--gray-100);
      outline: none;
      transition:
        border-color var(--transition),
        background var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    input::placeholder {
      color: #bbb;
      font-weight: 300;
    }

    input:hover {
      border-color: rgba(184,134,11,0.4);
      background: #fff;
    }

    input:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 4px var(--gold-glow), 0 2px 12px rgba(184,134,11,0.1);
      transform: translateY(-1px);
    }

    /* Validation states */
    input.valid {
      border-color: var(--success);
      background: #fff;
    }

    input.invalid {
      border-color: var(--error);
      background: #fff;
    }

    .input-group:focus-within .input-icon { color: var(--gold); }
    .input-group:focus-within label      { color: var(--gold); }

    /* Validation icon */
    .validation-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 18px;
      height: 18px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
    }

    .validation-icon.show { transform: translateY(-50%) scale(1); }
    .validation-icon.valid-icon { color: var(--success); }
    .validation-icon.invalid-icon { color: var(--error); }

    /* Password with toggle */
    .has-toggle input { padding-right: 48px; }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--gray-500);
      transition: color var(--transition), transform var(--transition);
      display: flex;
      align-items: center;
    }

    .toggle-password:hover {
      color: var(--gold);
      transform: translateY(-50%) scale(1.15);
    }

    /* Field hint */
    .field-hint {
      font-size: 11.5px;
      color: #bbb;
      margin-top: 5px;
      padding-left: 4px;
      transition: color var(--transition);
    }

    .field-hint.error-hint { color: var(--error); }

    /* Password strength */
    .strength-bar-wrap {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .strength-seg {
      height: 4px;
      border-radius: 2px;
      background: var(--gray-300);
      transition: background 0.4s ease;
    }

    .strength-seg.weak   { background: var(--error); }
    .strength-seg.fair   { background: var(--warning); }
    .strength-seg.good   { background: var(--gold); }
    .strength-seg.strong { background: var(--success); }

    .strength-label {
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
      color: #bbb;
      transition: color 0.3s;
    }

    /* ── Navigation buttons ── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-row.single { grid-template-columns: 1fr; }

    .btn-back {
      border: 1.5px solid var(--gray-300);
      cursor: pointer;
      padding: 15px;
      border-radius: 50px;
      background: transparent;
      color: var(--gray-500);
      font-weight: 600;
      font-family: inherit;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition:
        border-color var(--transition),
        color var(--transition),
        background var(--transition),
        transform var(--transition);
    }

    .btn-back:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-pale);
      transform: translateY(-2px);
    }

    .btn-back svg { transition: transform var(--transition); }
    .btn-back:hover svg { transform: translateX(-3px); }

    .btn-next,
    .btn-submit {
      position: relative;
      border: none;
      cursor: pointer;
      padding: 15px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
      background-size: 200% 200%;
      color: white;
      font-weight: 700;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition:
        background-position var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    .btn-next::before,
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      transform: skewX(-20deg) translateX(-150%);
      transition: transform 0.65s ease;
    }

    .btn-next:hover::before,
    .btn-submit:hover::before { transform: skewX(-20deg) translateX(250%); }

    .btn-next:hover,
    .btn-submit:hover {
      background-position: right center;
      box-shadow: 0 8px 28px rgba(184,134,11,0.45), 0 2px 8px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .btn-next:active,
    .btn-submit:active { transform: translateY(0); }

    .btn-next svg { transition: transform var(--transition); }
    .btn-next:hover svg { transform: translateX(3px); }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { opacity: 0.75; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Message ── */
    .message {
      text-align: center;
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition:
        max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        padding 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.3s ease;
    }

    .message.visible {
      max-height: 70px;
      padding: 11px 14px;
      opacity: 1;
    }

    .message.error {
      color: var(--error);
      background: rgba(220,53,69,0.08);
      border: 1px solid rgba(220,53,69,0.2);
    }

    .message.success {
      color: var(--success);
      background: rgba(25,135,84,0.08);
      border: 1px solid rgba(25,135,84,0.2);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gray-300), transparent);
    }

    .divider span {
      font-size: 12px;
      color: #bbb;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Bottom section ── */
    .bottom-section {
      margin-top: 20px;
      text-align: center;
    }

    .bottom-link {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 14px;
    }

    .bottom-link a {
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
      position: relative;
    }

    .bottom-link a::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 0; height: 1.5px;
      background: var(--gold);
      transition: width var(--transition);
      border-radius: 1px;
    }

    .bottom-link a:hover::after { width: 100%; }

    /* ── Terms checkbox ── */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .terms-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      padding: 0;
      accent-color: var(--gold);
      cursor: pointer;
      margin-top: 2px;
      transform: none;
    }

    .terms-row input[type="checkbox"]:focus {
      box-shadow: 0 0 0 3px var(--gold-glow);
      transform: none;
    }

    .terms-row label {
      font-size: 13px;
      color: var(--gray-500);
      line-height: 1.55;
      cursor: pointer;
      margin: 0 !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      color: var(--gray-500) !important;
      -webkit-text-fill-color: var(--gray-500) !important;
    }

    .terms-row label a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }

    .terms-row label a:hover { text-decoration: underline; }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-4px); }
      20%, 80% { transform: translateX(6px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .auth-card { padding: 36px 24px 30px; }
      .heading-block h1 { font-size: 26px; }
      .step-line { width: 40px; }
      .btn-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-wrapper">
        <img src="assets/img/dlclogo_long.png" alt="Dhaka Ladies Club">
      </div>
    </div>

    <!-- Heading -->
    <div class="heading-block">
      <h1>Create Account</h1>
      <p>Join Dhaka Ladies Club and start booking with ease</p>
    </div>

    <!-- Step progress -->
    <div class="step-progress" id="stepProgress">
      <div class="step active" id="stepDot1">
        <div class="step-circle">1</div>
        <span class="step-label">Profile</span>
      </div>
      <div class="step-line" id="stepLine1"></div>
      <div class="step" id="stepDot2">
        <div class="step-circle">2</div>
        <span class="step-label">Security</span>
      </div>
      <div class="step-line" id="stepLine2"></div>
      <div class="step" id="stepDot3">
        <div class="step-circle">3</div>
        <span class="step-label">Confirm</span>
      </div>
    </div>

    <!-- Form -->
    <form id="registerForm" novalidate>

      <!-- ── STEP 1 : Profile ── -->
      <div class="step-panel active" id="panel1">

        <div class="input-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="name" placeholder="e.g. Sadia Rahman" required autocomplete="name">
            <svg class="validation-icon" id="nameIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            <svg class="validation-icon" id="emailIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>

        <div class="input-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.21 3.4 2 2 0 0 1 3.18 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <input type="tel" id="phone" placeholder="+880 1X XX XXX XXX" required autocomplete="tel">
            <svg class="validation-icon" id="phoneIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>

        <div id="message1" class="message"></div>

        <div class="btn-row single">
          <button type="button" class="btn-next" id="nextBtn1">
            Continue
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ── STEP 2 : Security ── -->
      <div class="step-panel" id="panel2">

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper has-toggle">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <!-- Strength meter -->
          <div class="strength-bar-wrap" id="strengthBar">
            <div class="strength-seg" id="seg1"></div>
            <div class="strength-seg" id="seg2"></div>
            <div class="strength-seg" id="seg3"></div>
            <div class="strength-seg" id="seg4"></div>
          </div>
          <div class="strength-label" id="strengthLabel">Enter a password</div>
        </div>

        <div class="input-group">
          <label for="passwordConfirmation">Confirm Password</label>
          <div class="input-wrapper has-toggle">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input type="password" id="passwordConfirmation" placeholder="Re-enter your password" minlength="6" required autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="passwordConfirmation" aria-label="Toggle confirm password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="field-hint" id="matchHint"></p>
        </div>

        <div id="message2" class="message"></div>

        <div class="btn-row">
          <button type="button" class="btn-back" id="backBtn2">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Back
          </button>
          <button type="button" class="btn-next" id="nextBtn2">
            Continue
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ── STEP 3 : Confirm ── -->
      <div class="step-panel" id="panel3">

        <!-- Summary card -->
        <div style="background: var(--gold-pale); border: 1px solid rgba(184,134,11,0.18); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px;">
          <p style="font-size: 12px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.7px; margin: 0;">Account Summary</p>
          <div id="summaryRows" style="display: grid; gap: 8px;"></div>
        </div>

        <div class="terms-row">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a> of Dhaka Ladies Club.
          </label>
        </div>

        <div id="message3" class="message"></div>

        <div class="btn-row">
          <button type="button" class="btn-back" id="backBtn3">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Back
          </button>
          <button type="submit" class="btn-submit" id="registerButton">
            <div class="spinner"></div>
            <span class="btn-text">Create Account</span>
          </button>
        </div>
      </div>

    </form>

    <!-- Divider -->
    <div class="divider" style="margin-top: 22px;">
      <div class="divider-line"></div>
      <span>already a member?</span>
      <div class="divider-line"></div>
    </div>

    <!-- Bottom -->
    <div class="bottom-section">
      <p class="bottom-link">
        Have an account? <a id="loginLink" href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <script>
    window.API_BASE_URL = 'http://127.0.0.1:8000/api';
  </script>
  <script src="assets/js/auth.js"></script>

  <script>
    /* ═══════════════════════════════════════
       Helpers
    ═══════════════════════════════════════ */
    function getRedirectUrl() {
      return new URLSearchParams(window.location.search).get('redirect') || 'booking.html';
    }

    document.getElementById('loginLink').href =
      `login.html?redirect=${encodeURIComponent(getRedirectUrl())}`;

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `message ${type} visible`;
    }

    function hideMsg(id) {
      const el = document.getElementById(id);
      el.className = 'message';
      el.textContent = '';
    }

    function shakeCard() {
      const card = document.querySelector('.auth-card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both';
      setTimeout(() => { card.style.animation = ''; }, 500);
    }

    /* ═══════════════════════════════════════
       Step manager
    ═══════════════════════════════════════ */
    let currentStep = 1;

    function goToStep(next, isBack = false) {
      const from = document.getElementById(`panel${currentStep}`);
      const to   = document.getElementById(`panel${next}`);

      from.classList.remove('active');
      to.classList.add('active');
      if (isBack) to.classList.add('back-anim');
      else        to.classList.remove('back-anim');

      /* Update dots */
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`stepDot${i}`);
        dot.classList.remove('active', 'done');
        if (i < next)      dot.classList.add('done');
        else if (i === next) dot.classList.add('active');
      }

      /* Update lines */
      for (let i = 1; i <= 2; i++) {
        const line = document.getElementById(`stepLine${i}`);
        if (i < next) line.classList.add('done');
        else          line.classList.remove('done');
      }

      currentStep = next;

      /* Populate summary on step 3 */
      if (next === 3) populateSummary();
    }

    /* ═══════════════════════════════════════
       Inline validation helpers
    ═══════════════════════════════════════ */
    function setValid(inputId, iconId) {
      const inp  = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!inp || !icon) return;
      inp.classList.remove('invalid'); inp.classList.add('valid');
      icon.innerHTML = `<polyline points="20 6 9 17 4 12"/>`;
      icon.classList.remove('invalid-icon'); icon.classList.add('valid-icon', 'show');
    }

    function setInvalid(inputId, iconId) {
      const inp  = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!inp || !icon) return;
      inp.classList.remove('valid'); inp.classList.add('invalid');
      icon.innerHTML = `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`;
      icon.classList.remove('valid-icon'); icon.classList.add('invalid-icon', 'show');
    }

    function clearState(inputId, iconId) {
      const inp  = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!inp || !icon) return;
      inp.classList.remove('valid', 'invalid');
      icon.classList.remove('valid-icon', 'invalid-icon', 'show');
    }

    /* Live validation – Step 1 */
    document.getElementById('name').addEventListener('input', function () {
      this.value.trim().length >= 2 ? setValid('name','nameIcon') : clearState('name','nameIcon');
    });

    document.getElementById('email').addEventListener('input', function () {
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value.trim())
        ? setValid('email','emailIcon')
        : clearState('email','emailIcon');
    });

    document.getElementById('phone').addEventListener('input', function () {
      this.value.trim().length >= 7 ? setValid('phone','phoneIcon') : clearState('phone','phoneIcon');
    });

    /* ═══════════════════════════════════════
       Password strength
    ═══════════════════════════════════════ */
    function calcStrength(pw) {
      let score = 0;
      if (pw.length >= 6)  score++;
      if (pw.length >= 10) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      return Math.min(score, 4);
    }

    const strengthMeta = [
      null,
      { label: 'Weak',   cls: 'weak'   },
      { label: 'Fair',   cls: 'fair'   },
      { label: 'Good',   cls: 'good'   },
      { label: 'Strong', cls: 'strong' }
    ];

    document.getElementById('password').addEventListener('input', function () {
      const score = calcStrength(this.value);
      const segs  = ['seg1','seg2','seg3','seg4'];
      const meta  = strengthMeta[score];

      segs.forEach((id, i) => {
        const el = document.getElementById(id);
        el.className = 'strength-seg';
        if (i < score && meta) el.classList.add(meta.cls);
      });

      const lbl = document.getElementById('strengthLabel');
      lbl.textContent  = score ? `Password strength: ${meta.label}` : 'Enter a password';
      lbl.style.color  = score ? ({ weak: 'var(--error)', fair: 'var(--warning)', good: 'var(--gold)', strong: 'var(--success)' }[meta.cls]) : '#bbb';

      checkMatch();
    });

    /* Password match */
    function checkMatch() {
      const pw   = document.getElementById('password').value;
      const conf = document.getElementById('passwordConfirmation').value;
      const hint = document.getElementById('matchHint');

      if (!conf) { hint.textContent = ''; hint.className = 'field-hint'; return; }

      if (pw === conf) {
        hint.textContent = '✓ Passwords match';
        hint.className   = 'field-hint';
        hint.style.color = 'var(--success)';
      } else {
        hint.textContent = '✗ Passwords do not match';
        hint.className   = 'field-hint error-hint';
        hint.style.color = '';
      }
    }

    document.getElementById('passwordConfirmation').addEventListener('input', checkMatch);

    /* ═══════════════════════════════════════
       Password toggles
    ═══════════════════════════════════════ */
    const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', function () {
        const inp = document.getElementById(this.dataset.target);
        const svg = this.querySelector('svg');
        const isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        svg.innerHTML = isPass ? eyeClosed : eyeOpen;
      });
    });

    /* ═══════════════════════════════════════
       Step navigation
    ═══════════════════════════════════════ */
    document.getElementById('nextBtn1').addEventListener('click', () => {
      hideMsg('message1');
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name || name.length < 2) {
        setInvalid('name','nameIcon');
        showMsg('message1', 'Please enter your full name.', 'error');
        shakeCard(); return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setInvalid('email','emailIcon');
        showMsg('message1', 'Please enter a valid email address.', 'error');
        shakeCard(); return;
      }
      if (phone.length < 7) {
        setInvalid('phone','phoneIcon');
        showMsg('message1', 'Please enter a valid phone number.', 'error');
        shakeCard(); return;
      }

      goToStep(2);
    });

    document.getElementById('backBtn2').addEventListener('click', () => goToStep(1, true));

    document.getElementById('nextBtn2').addEventListener('click', () => {
      hideMsg('message2');
      const pw   = document.getElementById('password').value;
      const conf = document.getElementById('passwordConfirmation').value;

      if (pw.length < 6) {
        showMsg('message2', 'Password must be at least 6 characters.', 'error');
        shakeCard(); return;
      }
      if (pw !== conf) {
        showMsg('message2', 'Passwords do not match.', 'error');
        shakeCard(); return;
      }

      goToStep(3);
    });

    document.getElementById('backBtn3').addEventListener('click', () => goToStep(2, true));

    /* ═══════════════════════════════════════
       Summary
    ═══════════════════════════════════════ */
    function summaryRow(label, value) {
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(184,134,11,0.1);">
          <span style="font-size:12px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px;">${label}</span>
          <span style="font-size:13.5px; font-weight:600; color:var(--gray-700); max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${value}</span>
        </div>`;
    }

    function populateSummary() {
      document.getElementById('summaryRows').innerHTML =
        summaryRow('Name',  document.getElementById('name').value.trim()) +
        summaryRow('Email', document.getElementById('email').value.trim()) +
        summaryRow('Phone', document.getElementById('phone').value.trim()) +
        summaryRow('Password', '••••••••');
    }

    /* ═══════════════════════════════════════
       Form submit
    ═══════════════════════════════════════ */
    document.getElementById('registerForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      hideMsg('message3');

      if (!document.getElementById('terms').checked) {
        showMsg('message3', 'Please accept the Terms & Conditions to continue.', 'error');
        shakeCard(); return;
      }

      const button = document.getElementById('registerButton');
      button.disabled = true;
      button.classList.add('loading');

      try {
        const password             = document.getElementById('password').value;
        const passwordConfirmation = document.getElementById('passwordConfirmation').value;

        const response = await fetch(`${window.API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name:                  document.getElementById('name').value.trim(),
            email:                 document.getElementById('email').value.trim(),
            phone:                 document.getElementById('phone').value.trim(),
            password,
            password_confirmation: passwordConfirmation
          })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || result.message || 'Registration failed');

        saveAuthSession(result.data);

        showMsg('message3', '✓ Account created! Redirecting…', 'success');

        setTimeout(() => { window.location.href = getRedirectUrl(); }, 1000);

      } catch (error) {
        showMsg('message3', error.message || 'Registration failed. Please try again.', 'error');
        shakeCard();
      } finally {
        button.disabled = false;
        button.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
