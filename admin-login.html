<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Dhaka Ladies Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #b8860b;
      --gold-light: #d4a017;
      --gold-dark: #8f6908;
      --gold-pale: rgba(184,134,11,0.08);
      --gold-glow: rgba(184,134,11,0.25);
      --red: #dc3545;
      --green: #198754;
      --gray-100: #f8f8f8;
      --gray-300: #dddddd;
      --gray-500: #888888;
      --gray-700: #444444;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Body ── */
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(20,5,0,0.82) 100%),
        url('assets/img/BG-01.jpeg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      overflow: hidden;
    }

    /* Ambient orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(184,134,11,0.15) 0%, transparent 70%);
      top: -160px; left: -160px;
      animation: orbDrift 11s ease-in-out infinite alternate;
    }

    body::after {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(184,134,11,0.12) 0%, transparent 70%);
      bottom: -140px; right: -140px;
      animation: orbDrift 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes orbDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(45px,45px) scale(1.1); }
    }

    /* ── Card ── */
    .admin-card {
      position: relative;
      width: 100%;
      max-width: 470px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 46px 42px 40px;
      box-shadow:
        0 2px 0 rgba(184,134,11,0.4) inset,
        0 30px 80px rgba(0,0,0,0.35),
        0 4px 20px rgba(184,134,11,0.1);
      border: 1px solid rgba(184,134,11,0.16);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
      overflow: hidden;
    }

    /* Shimmer top bar */
    .admin-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold-dark) 20%,
        var(--gold) 40%,
        var(--gold-light) 50%,
        var(--gold) 60%,
        var(--gold-dark) 80%,
        transparent 100%);
      background-size: 200% 100%;
      border-radius: 28px 28px 0 0;
      animation: shimmer 2.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.93);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Admin badge ribbon */
    .admin-ribbon {
      position: absolute;
      top: 20px; right: -32px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: white;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 44px;
      transform: rotate(45deg);
      box-shadow: 0 2px 10px rgba(184,134,11,0.4);
      animation: fadeIn 0.6s 0.5s both;
    }

    /* Floating sparkles */
    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      pointer-events: none;
      animation: sparklePulse 3.5s ease-in-out infinite;
    }

    .sparkle:nth-child(1){ width:5px; height:5px; top:18%; right:9%;  animation-delay:0s; }
    .sparkle:nth-child(2){ width:4px; height:4px; top:58%; right:6%;  animation-delay:1.3s; }
    .sparkle:nth-child(3){ width:3px; height:3px; top:36%; left:7%;   animation-delay:2.2s; }

    @keyframes sparklePulse {
      0%,100%{ opacity:0; transform:scale(0.5) translateY(0); }
      50%    { opacity:0.5; transform:scale(1.3) translateY(-12px); }
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 26px;
      animation: fadeDown 0.6s 0.15s both;
    }

    .logo-wrap {
      display: inline-block;
      padding: 12px 22px;
      background: linear-gradient(135deg, rgba(184,134,11,0.07), rgba(184,134,11,0.02));
      border-radius: 16px;
      border: 1px solid rgba(184,134,11,0.14);
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .logo-wrap:hover {
      box-shadow: 0 8px 28px var(--gold-glow);
      transform: translateY(-2px);
    }

    .logo-wrap img {
      height: 44px;
      max-width: 200px;
      display: block;
    }

    /* ── Heading ── */
    .heading {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeDown 0.6s 0.25s both;
    }

    .heading h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .heading h1::after {
      content: '';
      display: block;
      width: 40px; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      margin: 8px auto 0;
      transition: width var(--transition);
    }

    .heading:hover h1::after { width: 80px; }

    /* Admin badge under heading */
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(184,134,11,0.1), rgba(184,134,11,0.05));
      border: 1px solid rgba(184,134,11,0.22);
      border-radius: 50px;
      padding: 5px 14px;
      margin-top: 10px;
    }

    .admin-badge svg {
      color: var(--gold);
      flex-shrink: 0;
    }

    .admin-badge span {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gold-dark);
      letter-spacing: 0.4px;
    }

    .heading p {
      color: var(--gray-500);
      font-size: 13.5px;
      line-height: 1.6;
      margin-top: 8px;
    }

    /* ── Form ── */
    form {
      display: grid;
      gap: 18px;
      animation: fadeDown 0.6s 0.35s both;
    }

    /* Input group */
    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--gold-dark);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 7px;
      transition: color var(--transition);
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--gray-500);
      pointer-events: none;
      transition: color var(--transition);
    }

    input {
      width: 100%;
      padding: 15px 16px 15px 48px;
      border: 1.5px solid var(--gray-300);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--gray-700);
      background: var(--gray-100);
      outline: none;
      transition:
        border-color var(--transition),
        background var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    input::placeholder { color: #bbb; font-weight: 300; }

    input:hover {
      border-color: rgba(184,134,11,0.4);
      background: #fff;
    }

    input:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 4px var(--gold-glow), 0 2px 12px rgba(184,134,11,0.1);
      transform: translateY(-1px);
    }

    .input-group:focus-within .input-icon { color: var(--gold); }
    .input-group:focus-within label      { color: var(--gold); }

    /* Password toggle */
    .has-toggle input { padding-right: 48px; }

    .toggle-btn {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      transition: color var(--transition), transform var(--transition);
    }

    .toggle-btn:hover {
      color: var(--gold);
      transform: translateY(-50%) scale(1.15);
    }

    /* ── Submit button ── */
    .btn-submit {
      position: relative;
      border: none;
      cursor: pointer;
      padding: 16px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
      background-size: 200% 200%;
      color: white;
      font-weight: 700;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.4px;
      overflow: hidden;
      margin-top: 4px;
      transition:
        background-position var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      transform: skewX(-20deg) translateX(-150%);
      transition: transform 0.65s ease;
    }

    .btn-submit:hover::before { transform: skewX(-20deg) translateX(250%); }

    .btn-submit:hover {
      background-position: right center;
      box-shadow: 0 10px 30px rgba(184,134,11,0.45), 0 2px 8px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .btn-submit:active { transform: translateY(0); }

    .btn-submit:disabled {
      opacity: 0.72;
      cursor: not-allowed;
      transform: none;
    }

    .btn-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    .btn-submit.loading .spinner  { display: block; }
    .btn-submit.loading .btn-text { opacity: 0.75; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Message ── */
    .message {
      text-align: center;
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 12px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.4s cubic-bezier(0.4,0,0.2,1),
        padding    0.4s cubic-bezier(0.4,0,0.2,1),
        opacity    0.3s ease;
    }

    .message.visible {
      max-height: 60px;
      padding: 11px 14px;
      opacity: 1;
    }

    .message.error {
      color: var(--red);
      background: rgba(220,53,69,0.08);
      border: 1px solid rgba(220,53,69,0.2);
    }

    .message.success {
      color: var(--green);
      background: rgba(25,135,84,0.08);
      border: 1px solid rgba(25,135,84,0.2);
    }

    /* ── Security note ── */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 4px;
      padding: 10px 14px;
      background: rgba(184,134,11,0.05);
      border: 1px solid rgba(184,134,11,0.12);
      border-radius: 12px;
      animation: fadeDown 0.6s 0.45s both;
    }

    .security-note svg { color: var(--gold); flex-shrink: 0; }

    .security-note span {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
      line-height: 1.5;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      animation: fadeDown 0.6s 0.5s both;
    }

    .divider-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gray-300), transparent);
    }

    .divider span { font-size: 12px; color: #bbb; font-weight: 500; }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      width: 100%;
      color: var(--gray-500);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 50px;
      border: 1.5px solid var(--gray-300);
      transition:
        color var(--transition),
        border-color var(--transition),
        background var(--transition),
        transform var(--transition),
        box-shadow var(--transition);
      animation: fadeDown 0.6s 0.55s both;
    }

    .back-link:hover {
      color: var(--gold);
      border-color: var(--gold);
      background: var(--gold-pale);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--gold-glow);
    }

    .back-link svg { transition: transform var(--transition); }
    .back-link:hover svg { transform: translateX(-3px); }

    /* ── Keyframes ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes shake {
      10%,90%  { transform: translateX(-4px); }
      20%,80%  { transform: translateX(6px); }
      30%,50%,70% { transform: translateX(-6px); }
      40%,60%  { transform: translateX(6px); }
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .admin-card { padding: 36px 24px 30px; }
      .heading h1 { font-size: 26px; }
      .admin-ribbon { display: none; }
    }
  </style>
</head>

<body>
  <div class="admin-card">

    <!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- Ribbon -->
    <div class="admin-ribbon">Admin</div>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-wrap">
        <img src="assets/img/dlclogo_long.png" alt="Dhaka Ladies Club">
      </div>
    </div>

    <!-- Heading -->
    <div class="heading">
      <h1>Admin Login</h1>
      <div class="admin-badge">
        <!-- Shield icon -->
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Super Admin Access Only</span>
      </div>
      <p>Only authorized administrators can access this dashboard.</p>
    </div>

    <!-- Form -->
    <form id="adminLoginForm" novalidate>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Admin Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email"
                 placeholder="admin@dhakaladiesclub.com"
                 required autocomplete="email">
        </div>
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Admin Password</label>
        <div class="input-wrap has-toggle">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password"
                 placeholder="Enter admin password"
                 required autocomplete="current-password">
          <button type="button" class="toggle-btn"
                  id="togglePassword" aria-label="Toggle password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Message -->
      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" id="loginButton">
        <div class="btn-inner">
          <div class="spinner"></div>
          <span class="btn-text">Login as Admin</span>
        </div>
      </button>

      <!-- Security note -->
      <div class="security-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>This is a secured admin portal. All access attempts are logged.</span>
      </div>

    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span>not an admin?</span>
      <div class="divider-line"></div>
    </div>

    <!-- Back link -->
    <a href="index.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Return to Website
    </a>

  </div>

<script>
  window.API_BASE_URL = 'http://127.0.0.1:8000/api';
</script>

<script src="assets/js/admin-auth.js"></script>

<script>
  /* ── Message helpers ── */
  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = `message ${type} visible`;
  }

  function hideMessage() {
    const el = document.getElementById('message');
    el.className = 'message';
    el.textContent = '';
  }

  /* ── Shake card ── */
  function shakeCard() {
    const card = document.querySelector('.admin-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'shake 0.45s cubic-bezier(0.36,0.07,0.19,0.97) both';
    setTimeout(() => { card.style.animation = ''; }, 500);
  }

  /* ── Password toggle ── */
  const eyeOpen = `
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>`;

  const eyeClosed = `
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
             a18.45 18.45 0 0 1 5.06-5.94"/>
    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
             a18.5 18.5 0 0 1-2.16 3.19"/>
    <line x1="1" y1="1" x2="23" y2="23"/>`;

  document.getElementById('togglePassword').addEventListener('click', function () {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    const isPass = inp.type === 'password';

    inp.type = isPass ? 'text' : 'password';
    icon.innerHTML = isPass ? eyeClosed : eyeOpen;
  });

  /* ── Form submit ── */
  document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideMessage();

    const button = document.getElementById('loginButton');
    button.disabled = true;
    button.classList.add('loading');

    try {
      const response = await fetch(`${window.API_BASE_URL}/admin/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || result.message || 'Admin login failed');
      }

      saveAdminSession(result.data);

      showMessage('✓ Login successful — redirecting to dashboard…', 'success');

      setTimeout(() => {
        window.location.assign('admin-dashboard.html');
      }, 600);

    } catch (error) {
      showMessage(error.message || 'Admin login failed. Please try again.', 'error');
      shakeCard();
    } finally {
      button.disabled = false;
      button.classList.remove('loading');
    }
  });
</script>
</body>
</html>
