<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Dhaka Ladies Club</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf7f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid #ead7a6;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #8f6908;
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd6c5;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: linear-gradient(135deg, #8f6908, #b8860b);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(220, 53, 69, 0.1);
      color: #dc3545;
    }

    .message.success {
      background: rgba(25, 135, 84, 0.1);
      color: #198754;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Change Password</h1>
    <p>Your account was created by admin. For security, please change your temporary password before continuing.</p>

    <form id="changePasswordForm">
      <label>Current Password</label>
      <input type="password" id="currentPassword" required placeholder="Admin provided password">

      <label>New Password</label>
      <input type="password" id="newPassword" required minlength="8" placeholder="New password">

      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" required minlength="8" placeholder="Confirm new password">

      <button type="submit" id="submitBtn">Save New Password</button>
    </form>

    <div class="message" id="messageBox"></div>
  </div>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000/api';
    const CUSTOMER_TOKEN_KEY = 'dlc_customer_token_v1';
    const CUSTOMER_USER_KEY = 'dlc_customer_user_v1';

    function getRedirectUrl() {
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect');

  return redirect && redirect.trim() !== '' ? redirect : 'index.html';
}

    function showMessage(text, type = 'error') {
      const box = document.getElementById('messageBox');
      box.textContent = text;
      box.className = `message ${type} show`;
    }

    function getToken() {
      return localStorage.getItem(CUSTOMER_TOKEN_KEY);
    }

    async function checkAccess() {
      const token = getToken();

      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const response = await fetch(`${API_BASE_URL}/auth/me`, {
        headers: {
          Accept: 'application/json',
          Authorization: `Bearer ${token}`
        }
      });

      const result = await response.json();

      if (!response.ok) {
        localStorage.removeItem(CUSTOMER_TOKEN_KEY);
        localStorage.removeItem(CUSTOMER_USER_KEY);
        window.location.href = 'login.html';
        return;
      }

      localStorage.setItem(CUSTOMER_USER_KEY, JSON.stringify(result.data.user));

      if (!result.data.user.must_change_password) {
        window.location.href = getRedirectUrl();
      }
    }

    async function submitChangePassword(event) {
      event.preventDefault();

      const token = getToken();

      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showMessage('New password and confirmation password do not match.');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const response = await fetch(`${API_BASE_URL}/auth/change-password`, {
          method: 'POST',
          headers: {
            Accept: 'application/json',
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
            new_password_confirmation: confirmPassword
          })
        });

        const result = await response.json();

        if (!response.ok) {
          const validationErrors = result.errors
            ? Object.values(result.errors).flat().join('\\n')
            : '';

          throw new Error(result.message || validationErrors || 'Unable to change password.');
        }

        localStorage.setItem(CUSTOMER_TOKEN_KEY, result.data.token);
        localStorage.setItem(CUSTOMER_USER_KEY, JSON.stringify(result.data.user));

        showMessage('Password changed successfully. Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 900);
      } catch (error) {
        showMessage(error.message || 'Unable to change password.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save New Password';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAccess();
      document.getElementById('changePasswordForm').addEventListener('submit', submitChangePassword);
    });
  </script>
</body>
</html>
